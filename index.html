    .text-input { background:var(--surface2); border:1px solid var(--border); color:var(--text); font-family:var(--font); font-size:.88rem; padding:8px 12px; border-radius:7px; width:100%; transition:border-color .15s; }
    .text-input:focus { outline:none; border-color:var(--accent); }

    .resumen__grid { display:grid; grid-template-columns:1fr 1fr 1fr; padding:20px 24px; gap:16px; }

    @media(max-width:700px){.resumen__sub{grid-template-columns:1fr;}}
    .resumen__sub-col { padding:18px 22px; border-right:1px solid var(--border); }

    .resumen__sub-col--costo { background:linear-gradient(160deg,#0a1e15,#08101e); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .sub-title { font-size:.68rem; text-transform:uppercase; letter-spacing:.09em; color:var(--accent2); font-weight:600; margin-bottom:12px; }
    .sm-row { display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); padding:3px 0; }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback, useEffect } = React;

const SMMLV=1750905, AUX_TRANSPORTE=249095, HORAS_MES=220;
const SALUD_EMP=0.04, PENSION_EMP=0.04;
const SALUD_EMP_EMP=0.085, PENSION_EMP_EMP=0.12;
const SENA=0.02, ICBF=0.03, CAJA=0.04;
const DIAS_MES=30, QUINCENA=15;

const ARL_CLASES=[
  {id:"I",   label:"Clase I – Riesgo mínimo",  tasa:0.00522, desc:"Oficinas, comercio, administración"},
  {id:"II",  label:"Clase II – Riesgo bajo",    tasa:0.01044, desc:"Almacenes, talleres, depósitos"},
  {id:"III", label:"Clase III – Riesgo medio",  tasa:0.02436, desc:"Manufactura, panaderías, industria"},
  {id:"IV",  label:"Clase IV – Riesgo alto",    tasa:0.04350, desc:"Construcción, minería liviana"},
  {id:"V",   label:"Clase V – Riesgo máximo",   tasa:0.06960, desc:"Explosivos, minería subterránea"},
];

const FACTOR_HED=1.25, FACTOR_HEN=1.75, FACTOR_RN=1.35;
const FACTOR_RDF_H1=1.80, FACTOR_RDF_H2=1.90;
const FACTOR_HED_D_H1=2.05, FACTOR_HED_D_H2=2.15;
const FACTOR_HEN_D_H1=2.55, FACTOR_HEN_D_H2=2.65;

const LS_EMP="colnomina_empleados", LS_HIST="colnomina_historial", LS_EMP_DATA="colnomina_empresa", LS_PAP="colnomina_papelera";
const fmt=n=>"$"+Math.round(n).toLocaleString("es-CO").replace(/,/g,".");
const pct=t=>(t*100).toFixed(3)+"%";
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};

function calcularEmpleado(emp){
  const{salarioBase,diasTrabajados,horasExtraDiurna,horasExtraNocturna,
        horasRecNocturno,horasExtraDomDiurna,horasExtraDomNocturna,
        diasDomOrdinario,semestre,vales,prestamos,arlClase}=emp;
  const sem=semestre||"H1";
  const RDF=sem==="H2"?FACTOR_RDF_H2:FACTOR_RDF_H1;
  const HEDOM_D=sem==="H2"?FACTOR_HED_D_H2:FACTOR_HED_D_H1;
  const HEDOM_N=sem==="H2"?FACTOR_HEN_D_H2:FACTOR_HEN_D_H1;
  const arlTasa=(ARL_CLASES.find(c=>c.id===arlClase)||ARL_CLASES[0]).tasa;
  const salarioDiario=salarioBase/DIAS_MES;
  const horaOrdinaria=salarioBase/HORAS_MES;
  const basico=salarioDiario*diasTrabajados;
  const tieneAux=salarioBase<=SMMLV*2;
  const auxTransporte=tieneAux?(AUX_TRANSPORTE/DIAS_MES)*diasTrabajados:0;
  const vHED=(horasExtraDiurna||0)*horaOrdinaria*FACTOR_HED;
  const vHEN=(horasExtraNocturna||0)*horaOrdinaria*FACTOR_HEN;
  const vRN=(horasRecNocturno||0)*horaOrdinaria*FACTOR_RN;
  const vDomOrd=(diasDomOrdinario||0)*salarioDiario*RDF;
  const vHEDomD=(horasExtraDomDiurna||0)*horaOrdinaria*HEDOM_D;
  const vHEDomN=(horasExtraDomNocturna||0)*horaOrdinaria*HEDOM_N;
  const totalExtras=vHED+vHEN+vRN+vDomOrd+vHEDomD+vHEDomN;
  const totalDevengado=basico+auxTransporte+totalExtras;
  const ibc=basico+totalExtras;
  const dedSalud=ibc*SALUD_EMP;
  const dedPension=ibc*PENSION_EMP;
  const totalDeducciones=dedSalud+dedPension+(vales||0)+(prestamos||0);
  const netoPagado=totalDevengado-totalDeducciones;
  // Aportes empresa — IBC de la quincena (base correcta, sin x2)
  const saludEmpresa=ibc*SALUD_EMP_EMP;      // 8.5%
  const pensionEmpresa=ibc*PENSION_EMP_EMP;  // 12%
  const senaValor=ibc*SENA;                  // 2%
  const icbfValor=ibc*ICBF;                  // 3%
  const cajaValor=ibc*CAJA;                  // 4%
  const arlValor=ibc*arlTasa;                // clase asignada
  // Apropiaciones quincena — porcentajes legales Art.249/306/189 CST
  const basePrest=basico+auxTransporte;
  // Apropiaciones — fórmula legal CST Art.249/306/189
  // Cesantías = (base × días) ÷ 360  — base incluye aux transporte
  // Prima     = (base × días) ÷ 360  — igual que cesantías
  // Vacaciones= (salario × días) ÷ 720 — NO incluye aux transporte
  // Int.Ces.  = cesantías × 12%
  // Apropiaciones — base MENSUAL × días ÷ 360  (CST Art.249/306/189)
  // baseMes = salario mensual + aux transporte mensual (si aplica)
  const baseMes=salarioBase+(tieneAux?AUX_TRANSPORTE:0);
  const cesantias=(baseMes*diasTrabajados)/360;
  // Int.cesantías = cesantías × 0.005  (= ces × 15 × 0.12 ÷ 360)
  // Int.cesantías = basePrest × (15×0.24÷360) = basePrest × 0.01 (1%)
  const intCesantias=basePrest*0.01;
  const prima=(baseMes*diasTrabajados)/360;
  // Vacaciones: base salario mensual SIN aux (Art.192 CST) ÷ 720
  const vacaciones=(salarioBase*diasTrabajados)/720;
  return{salarioDiario,horaOrdinaria,basico,auxTransporte,
    vHED,vHEN,vRN,vDomOrd,vHEDomD,vHEDomN,totalExtras,
    totalDevengado,ibc,dedSalud,dedPension,
    vales:vales||0,prestamos:prestamos||0,
    totalDeducciones,netoPagado,
    saludEmpresa,pensionEmpresa,senaValor,icbfValor,cajaValor,arlValor,arlTasa,
    cesantias,intCesantias,prima,vacaciones,
    totalAportes:saludEmpresa+pensionEmpresa+senaValor+icbfValor+cajaValor+arlValor,
    totalApropiaciones:cesantias+intCesantias+prima+vacaciones};
}

function Historial({historial,papelera,onLimpiar,onBorrarRegistro,onRecuperar,onLimpiarPapelera}){
  const[verPapelera,setVerPapelera]=useState(false);
  const lista=verPapelera?(papelera||[]):historial;
  const porEmp={};
  lista.forEach(r=>{
    const k=r.cc||r.nombre||"?";
    if(!porEmp[k]) porEmp[k]={nombre:r.nombre,cc:r.cc,pagos:[]};
    porEmp[k].pagos.push(r);
  });
  const sinRegistros=lista.length===0;
  return(
    <div>
      <div className="historial__toolbar">
        <span className="historial__title">
          {verPapelera?"🗑 Papelera":"📋 Historial"} · {lista.length} registro{lista.length!==1?"s":""}
        </span>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button className="btn-save" style={{fontSize:".78rem",padding:"6px 12px"}}
            onClick={()=>setVerPapelera(!verPapelera)}>
            {verPapelera?"← Volver al historial":`🗑 Papelera (${(papelera||[]).length})`}
          </button>
          {verPapelera&&(papelera||[]).length>0&&
            <button className="btn-danger" onClick={onLimpiarPapelera}>Vaciar papelera</button>}
          {!verPapelera&&
            <button className="btn-danger" onClick={onLimpiar}>🗑 Limpiar todo</button>}
        </div>
      </div>
      {sinRegistros&&<div className="hist-empty">{verPapelera?"La papelera está vacía.":"Aún no hay pagos guardados. Abre un empleado y presiona Guardar pago esta quincena."}</div>}
      {!sinRegistros&&Object.values(porEmp).map(emp=>(
        <div key={emp.cc||emp.nombre} className="hist-card">
          <div className="hist-card__header">
            <div className="hist-card__info">
              <span className="hist-card__nombre">{emp.nombre||"Sin nombre"}</span>
              <span className="hist-card__fecha">CC {emp.cc||"—"} · {emp.pagos.length} pago{emp.pagos.length!==1?"s":""}</span>
            </div>
            <span className="hist-card__neto">Total pagado: {fmt(emp.pagos.reduce((s,p)=>s+p.netoPagado,0))}</span>
          </div>
          {emp.pagos.map((p,i)=>(
            <div key={p.id||i}>
              {i>0&&<div style={{borderTop:"1px dashed var(--border)",margin:"0 16px"}}/>}
              <div className="hist-card__body" style={{position:"relative"}}>
                {/* Botón borrar registro individual */}
                {verPapelera?(
                  <button onClick={()=>onRecuperar(p.id)}
                    style={{position:"absolute",top:4,right:4,background:"transparent",
                      border:"1px solid var(--border)",color:"var(--muted)",cursor:"pointer",
                      fontSize:".72rem",padding:"2px 8px",borderRadius:5,transition:"all .15s",
                      display:"flex",alignItems:"center",gap:4}}
                    onMouseOver={e=>{e.currentTarget.style.borderColor="var(--green)";e.currentTarget.style.color="var(--green)";}}
                    onMouseOut={e=>{e.currentTarget.style.borderColor="var(--border)";e.currentTarget.style.color="var(--muted)";}}
                    title="Recuperar registro">↩ Recuperar</button>
                ):(
                  <button onClick={()=>onBorrarRegistro(p.id)}
                    style={{position:"absolute",top:4,right:4,background:"transparent",
                      border:"1px solid var(--border)",color:"var(--muted)",cursor:"pointer",
                      fontSize:".72rem",padding:"2px 8px",borderRadius:5,transition:"all .15s",
                      display:"flex",alignItems:"center",gap:4}}
                    onMouseOver={e=>{e.currentTarget.style.borderColor="var(--red)";e.currentTarget.style.color="var(--red)";}}
                    onMouseOut={e=>{e.currentTarget.style.borderColor="var(--border)";e.currentTarget.style.color="var(--muted)";}}
                    title="Mover a papelera">✕ Borrar</button>
                )}
                <div className="hist-item"><span className="hist-periodo">{p.periodo}</span></div>
                <div className="hist-item">Devengado <strong>{fmt(p.totalDevengado)}</strong></div>
                <div className="hist-item">Deducciones <strong>{fmt(p.totalDeducciones)}</strong></div>
                <div className="hist-item">Neto <strong style={{color:"var(--green)"}}>{fmt(p.netoPagado)}</strong></div>
                <div className="hist-item">ARL Clase <strong>{p.arlClase}</strong> ({pct((ARL_CLASES.find(c=>c.id===p.arlClase)||ARL_CLASES[0]).tasa)})</div>
                <div className="hist-item">Básico <strong>{fmt(p.basico)}</strong></div>
                {p.auxTransporte>0&&<div className="hist-item">Aux. Transp. <strong>{fmt(p.auxTransporte)}</strong></div>}
                {p.totalExtras>0&&<div className="hist-item">Extras/Recargos <strong>{fmt(p.totalExtras)}</strong></div>}

          ))}

      ))}

function ResumenEmpresa({empleados,calcsTodos,periodo,onChangePeriodo,historial}){
  // ── Quincena actual (empleados en pantalla) ──
  const s=fn=>calcsTodos.reduce((a,c)=>a+fn(c),0);
  const totDev=s(c=>c.totalDevengado),totDed=s(c=>c.totalDeducciones),totNeto=s(c=>c.netoPagado);
  const totSalud=s(c=>c.saludEmpresa),totPens=s(c=>c.pensionEmpresa);
  const totSena=s(c=>c.senaValor),totIcbf=s(c=>c.icbfValor);
  const totCaja=s(c=>c.cajaValor),totArl=s(c=>c.arlValor);
  const totCes=s(c=>c.cesantias),totInt=s(c=>c.intCesantias);
  const totPrim=s(c=>c.prima),totVac=s(c=>c.vacaciones);
  const costoTotal=totNeto+totSalud+totPens+totSena+totIcbf+totCaja+totArl+totCes+totInt+totPrim+totVac;

  // ── Pagos guardados: agrupar por período ──
  const porPeriodo={};
  (historial||[]).forEach(p=>{
    if(!porPeriodo[p.periodo]) porPeriodo[p.periodo]={periodo:p.periodo,pagos:[],fechaGuardado:p.fechaGuardado};
    porPeriodo[p.periodo].pagos.push(p);
  });
  const quincenas=Object.values(porPeriodo).map(q=>({
    periodo:q.periodo,
    fechaGuardado:q.fechaGuardado,
    numEmp:q.pagos.length,
    totalDevengado:q.pagos.reduce((s,p)=>s+p.totalDevengado,0),
    totalDeducciones:q.pagos.reduce((s,p)=>s+p.totalDeducciones,0),
    netoPagado:q.pagos.reduce((s,p)=>s+p.netoPagado,0),
    totalExtras:q.pagos.reduce((s,p)=>s+(p.totalExtras||0),0),
    saludEmpresa:q.pagos.reduce((s,p)=>s+(p.saludEmpresa||0),0),
    pensionEmpresa:q.pagos.reduce((s,p)=>s+(p.pensionEmpresa||0),0),
    senaValor:q.pagos.reduce((s,p)=>s+(p.senaValor||0),0),
    icbfValor:q.pagos.reduce((s,p)=>s+(p.icbfValor||0),0),
    cajaValor:q.pagos.reduce((s,p)=>s+(p.cajaValor||0),0),
    arlValor:q.pagos.reduce((s,p)=>s+(p.arlValor||0),0),
    cesantias:q.pagos.reduce((s,p)=>s+(p.cesantias||0),0),
    intCesantias:q.pagos.reduce((s,p)=>s+(p.intCesantias||0),0),
    prima:q.pagos.reduce((s,p)=>s+(p.prima||0),0),
    vacaciones:q.pagos.reduce((s,p)=>s+(p.vacaciones||0),0),
  }));
  const acumDev=quincenas.reduce((s,q)=>s+q.totalDevengado,0);
  const acumDed=quincenas.reduce((s,q)=>s+q.totalDeducciones,0);
  const acumNeto=quincenas.reduce((s,q)=>s+q.netoPagado,0);
  const acumSalud=quincenas.reduce((s,q)=>s+(q.saludEmpresa||0),0);
  const acumPens=quincenas.reduce((s,q)=>s+(q.pensionEmpresa||0),0);
  const acumSena=quincenas.reduce((s,q)=>s+(q.senaValor||0),0);
  const acumIcbf=quincenas.reduce((s,q)=>s+(q.icbfValor||0),0);
  const acumCaja=quincenas.reduce((s,q)=>s+(q.cajaValor||0),0);
  const acumArl=quincenas.reduce((s,q)=>s+(q.arlValor||0),0);
  const acumCes=quincenas.reduce((s,q)=>s+(q.cesantias||0),0);
  const acumInt=quincenas.reduce((s,q)=>s+(q.intCesantias||0),0);
  const acumPrim=quincenas.reduce((s,q)=>s+(q.prima||0),0);
  const acumVac=quincenas.reduce((s,q)=>s+(q.vacaciones||0),0);
  const acumCostoTotal=acumNeto+(acumSalud+acumPens+acumSena+acumIcbf+acumCaja+acumArl)+(acumCes+acumInt+acumPrim+acumVac);

  return(
    <div>
      {/* ── Quincena en pantalla: pagos guardados del período seleccionado ── */}
      <div className="resumen" style={{marginBottom:24}}>
        <div className="resumen__header" style={{flexWrap:"wrap",gap:12}}>
          <span className="resumen__icon">📊</span>
          <div style={{flex:1}}>
            <div className="resumen__title">Quincena en pantalla</div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginTop:6,flexWrap:"wrap"}}>
              <input type="date" className="date-input" value={periodo.inicio}
                onChange={e=>onChangePeriodo("inicio",e.target.value)}/>
              <span style={{color:"var(--accent)",fontWeight:600}}>→</span>
              <input type="date" className="date-input" value={periodo.fin}
                onChange={e=>onChangePeriodo("fin",e.target.value)}/>
            </div>
          </div>
        </div>
        {(()=>{
          // Filtrar pagos cuya fecha de inicio de quincena esté dentro del rango elegido
          const desde=new Date(periodo.inicio);
          const hasta=new Date(periodo.fin);
          const pagosRango=(historial||[]).filter(r=>{
            const fIni=new Date((r.periodoKey||"").split("_")[0]);
            return fIni>=desde && fIni<=hasta;
          });
          // Agrupar por quincena (periodoKey)
          const porQ={};
          pagosRango.forEach(p=>{
            if(!porQ[p.periodoKey]) porQ[p.periodoKey]={periodo:p.periodo,pagos:[]};
            porQ[p.periodoKey].pagos.push(p);
          });
          const quincsRango=Object.values(porQ);
          const totDev=pagosRango.reduce((s,p)=>s+p.totalDevengado,0);
          const totDed=pagosRango.reduce((s,p)=>s+p.totalDeducciones,0);
          const totNeto=pagosRango.reduce((s,p)=>s+p.netoPagado,0);
          const totAp=pagosRango.reduce((s,p)=>s+(p.saludEmpresa||0)+(p.pensionEmpresa||0)+(p.senaValor||0)+(p.icbfValor||0)+(p.cajaValor||0)+(p.arlValor||0),0);
          const totPrest=pagosRango.reduce((s,p)=>s+(p.cesantias||0)+(p.intCesantias||0)+(p.prima||0)+(p.vacaciones||0),0);
          const costoRango=totNeto+totAp+totPrest;
          if(pagosRango.length===0) return(
            <div style={{padding:"20px 24px",color:"var(--muted)",fontSize:".85rem"}}>
              No hay pagos guardados en el período seleccionado. Ajusta las fechas o registra los pagos.
            </div>
          );
          return(<>
            {/* Badges resumen */}
            <div style={{padding:"12px 24px 0",display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
              <span style={{background:"var(--surface2)",border:"1px solid var(--border2)",borderRadius:20,padding:"4px 12px",fontSize:".78rem",color:"var(--accent)",fontFamily:"var(--mono)"}}>
                {quincsRango.length} quincena{quincsRango.length!==1?"s":""}
              </span>
              <span style={{background:"var(--surface2)",border:"1px solid var(--border2)",borderRadius:20,padding:"4px 12px",fontSize:".78rem",color:"var(--green)",fontFamily:"var(--mono)"}}>
                {pagosRango.length} pago{pagosRango.length!==1?"s":""}
              </span>
              <span style={{background:"linear-gradient(135deg,#1a2540,#1f2d50)",border:"1px solid #2a3d6b",borderRadius:20,padding:"4px 12px",fontSize:".78rem",color:"var(--amber)",fontFamily:"var(--mono)"}}>
                Costo total: {fmt(costoRango)}
              </span>
            </div>
            {/* Quincenas del rango */}
            {quincsRango.map((q,qi)=>(
              <div key={qi} style={{margin:"12px 24px 0",border:"1px solid var(--border2)",borderRadius:10,overflow:"hidden"}}>
                <div style={{background:"var(--surface2)",padding:"8px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
                  <span style={{fontSize:".78rem",color:"var(--accent)",fontFamily:"var(--mono)",fontWeight:600}}>{q.periodo}</span>
                  <span style={{fontSize:".75rem",color:"var(--muted)"}}>{q.pagos.length} empleado{q.pagos.length!==1?"s":""}</span>
                </div>
                {q.pagos.map((p,pi)=>(
                  <div key={pi} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                    padding:"7px 14px",borderTop:"1px solid var(--border)",flexWrap:"wrap",gap:6}}>
                    <div>
                      <div style={{fontWeight:600,fontSize:".85rem"}}>{p.nombre}</div>
                      <div style={{fontSize:".7rem",color:"var(--muted)",fontFamily:"var(--mono)"}}>CC {p.cc||"—"}</div>
                    </div>
                    <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:".65rem",color:"var(--muted)",textTransform:"uppercase"}}>Devengado</div>
                        <div style={{fontFamily:"var(--mono)",fontSize:".82rem",color:"#7eb3ff"}}>{fmt(p.totalDevengado)}</div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:".65rem",color:"var(--muted)",textTransform:"uppercase"}}>Deducciones</div>
                        <div style={{fontFamily:"var(--mono)",fontSize:".82rem",color:"#f87171"}}>{fmt(p.totalDeducciones)}</div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:".65rem",color:"var(--muted)",textTransform:"uppercase"}}>Neto</div>
                        <div style={{fontFamily:"var(--mono)",fontSize:".82rem",fontWeight:700,color:"var(--green)"}}>{fmt(p.netoPagado)}</div>
                      </div>
                    </div>
                  </div>
                ))}
                {/* Subtotal quincena */}
                <div style={{display:"flex",justifyContent:"flex-end",gap:14,padding:"6px 14px",
                  background:"#0d1929",borderTop:"1px solid var(--border2)",flexWrap:"wrap"}}>
                  <span style={{fontSize:".75rem",color:"var(--muted)"}}>Subtotal quincena →</span>
                  <span style={{fontFamily:"var(--mono)",fontSize:".82rem",color:"#7eb3ff"}}>{fmt(q.pagos.reduce((s,p)=>s+p.totalDevengado,0))}</span>
                  <span style={{fontFamily:"var(--mono)",fontSize:".82rem",color:"#f87171"}}>{fmt(q.pagos.reduce((s,p)=>s+p.totalDeducciones,0))}</span>
                  <span style={{fontFamily:"var(--mono)",fontSize:".82rem",fontWeight:700,color:"var(--green)"}}>{fmt(q.pagos.reduce((s,p)=>s+p.netoPagado,0))}</span>
                </div>
              </div>
            ))}
            {/* Totales del rango */}
            <div className="resumen__grid" style={{marginTop:16}}>
              <div className="res-block res-block--blue"><div className="res-block__label">Total Devengado</div><div className="res-block__value">{fmt(totDev)}</div></div>
              <div className="res-block res-block--red"><div className="res-block__label">Total Deducciones</div><div className="res-block__value">{fmt(totDed)}</div></div>
              <div className="res-block res-block--green"><div className="res-block__label">Total Neto Pagado</div><div className="res-block__value">{fmt(totNeto)}</div></div>
            </div>
            {/* Aportes + apropiaciones del rango */}
            <div className="resumen__sub">
              <div className="resumen__sub-col">
                <div className="sub-title">Aportes Empresa (rango)</div>
                <SmRow label="Salud (8.5%)" v={pagosRango.reduce((s,p)=>s+(p.saludEmpresa||0),0)}/>
                <SmRow label="Pensión (12%)" v={pagosRango.reduce((s,p)=>s+(p.pensionEmpresa||0),0)}/>
                <SmRow label="SENA (2%)" v={pagosRango.reduce((s,p)=>s+(p.senaValor||0),0)}/>
                <SmRow label="ICBF (3%)" v={pagosRango.reduce((s,p)=>s+(p.icbfValor||0),0)}/>
                <SmRow label="Caja (4%)" v={pagosRango.reduce((s,p)=>s+(p.cajaValor||0),0)}/>
                <SmRow label="ARL" v={pagosRango.reduce((s,p)=>s+(p.arlValor||0),0)}/>
                <SmRow label="TOTAL APORTES" v={totAp} bold/>
              </div>
              <div className="resumen__sub-col">
                <div className="sub-title">Apropiaciones (rango)</div>
                <SmRow label="Cesantías (8.33%)" v={pagosRango.reduce((s,p)=>s+(p.cesantias||0),0)}/>
                <SmRow label="Int. Cesantías" v={pagosRango.reduce((s,p)=>s+(p.intCesantias||0),0)}/>
                <SmRow label="Prima (8.33%)" v={pagosRango.reduce((s,p)=>s+(p.prima||0),0)}/>
                <SmRow label="Vacaciones (4.17%)" v={pagosRango.reduce((s,p)=>s+(p.vacaciones||0),0)}/>
                <SmRow label="TOTAL APROPIADO" v={totPrest} bold/>
              </div>
              <div className="resumen__sub-col resumen__sub-col--costo">
                <div className="sub-title">Costo Total Laboral</div>
                <div className="costo-value">{fmt(costoRango)}</div>
                <div className="costo-label">{quincsRango.length} quincena{quincsRango.length!==1?"s":""}</div>
                <div className="costo-anual">Prom/quincena: {fmt(costoRango/Math.max(quincsRango.length,1))}</div>
              </div>
            </div>
          </>);
        })()}
      </div>
      {/* ── Gastos acumulados por quincenas guardadas ── */}
      <div className="resumen">
        <div className="resumen__header">
          <span className="resumen__icon">💰</span>
          <div>
            <div className="resumen__title">Gastos acumulados — Pagos guardados</div>
            <div className="resumen__periodo">{quincenas.length} quincena{quincenas.length!==1?"s":""} registrada{quincenas.length!==1?"s":""}</div>
          </div>
          {quincenas.length>0&&(
            <div className="resumen__emp-count" style={{color:"var(--amber)"}}>
              Total: {fmt(acumNeto)}
            </div>
          )}
        </div>

        {quincenas.length===0?(
          <div style={{padding:"32px 24px",color:"var(--muted)",fontSize:".88rem",textAlign:"center"}}>
            Aún no hay quincenas guardadas.<br/>
            Abre cada empleado → completa los datos → presiona <strong style={{color:"var(--accent)"}}>«💾 Guardar pago esta quincena»</strong>.
          </div>
        ):(
          <>
            {/* Totales acumulados — neto + aportes + apropiaciones */}
            <div className="resumen__grid" style={{paddingBottom:0}}>
              <div className="res-block res-block--blue"><div className="res-block__label">Devengado acumulado</div><div className="res-block__value">{fmt(acumDev)}</div></div>
              <div className="res-block res-block--red"><div className="res-block__label">Deducciones acumuladas</div><div className="res-block__value">{fmt(acumDed)}</div></div>
              <div className="res-block res-block--green"><div className="res-block__label">Neto pagado acumulado</div><div className="res-block__value">{fmt(acumNeto)}</div></div>
            </div>
            {/* Aportes + apropiaciones + costo total acumulado */}
            <div className="resumen__sub">
              <div className="resumen__sub-col">
                <div className="sub-title">Aportes Empresa acumulados</div>
                <SmRow label="Salud (8.5%)" v={acumSalud}/>
                <SmRow label="Pensión (12%)" v={acumPens}/>
                <SmRow label="SENA (2%)" v={acumSena}/>
                <SmRow label="ICBF (3%)" v={acumIcbf}/>
                <SmRow label="Caja (4%)" v={acumCaja}/>
                <SmRow label="ARL (clase/s)" v={acumArl}/>
                <SmRow label="TOTAL APORTES" v={acumSalud+acumPens+acumSena+acumIcbf+acumCaja+acumArl} bold/>
              </div>
              <div className="resumen__sub-col">
                <div className="sub-title">Apropiaciones acumuladas</div>
                <SmRow label="Cesantías (8.33%)" v={acumCes}/>
                <SmRow label="Int. Cesantías (12%)" v={acumInt}/>
                <SmRow label="Prima (8.33%)" v={acumPrim}/>
                <SmRow label="Vacaciones (4.17%)" v={acumVac}/>
                <SmRow label="TOTAL APROPIADO" v={acumCes+acumInt+acumPrim+acumVac} bold/>
              </div>
              <div className="resumen__sub-col resumen__sub-col--costo">
                <div className="sub-title">Costo Total Laboral<br/>Acumulado</div>
                <div className="costo-value">{fmt(acumCostoTotal)}</div>
                <div className="costo-label">{quincenas.length} quincena{quincenas.length!==1?"s":""} pagadas</div>
                <div className="costo-anual">Prom/quincena: {fmt(acumCostoTotal/Math.max(quincenas.length,1))}</div>
              </div>
            </div>

            {/* Detalle por quincena */}
            <div style={{padding:"16px 24px 20px"}}>
              <div className="sub-title" style={{marginBottom:14}}>Detalle por quincena guardada</div>
              {quincenas.map((q,i)=>(
                <div key={i} className="quin-row">
                  <div className="quin-row__periodo">
                    <span className="hist-periodo">{q.periodo}</span>
                    <span className="quin-emp">{q.numEmp} empleado{q.numEmp!==1?"s":""}</span>
                  </div>
                  <div className="quin-row__vals">
                    <div className="quin-val"><span>Devengado</span><strong>{fmt(q.totalDevengado)}</strong></div>
                    <div className="quin-val"><span>Deducciones</span><strong style={{color:"var(--red)"}}>{fmt(q.totalDeducciones)}</strong></div>
                    <div className="quin-val"><span>Neto pagado</span><strong style={{color:"var(--green)"}}>{fmt(q.netoPagado)}</strong></div>
                    {q.totalExtras>0&&<div className="quin-val"><span>Extras/Recargos</span><strong style={{color:"var(--amber)"}}>{fmt(q.totalExtras)}</strong></div>}
                  </div>
                </div>
              ))}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function App(){
  const today=new Date();
  const yyyy=today.getFullYear();
  const mm=String(today.getMonth()+1).padStart(2,"0");
  const defEmpData={nombre:"",nit:"",inicio:`${yyyy}-${mm}-01`,fin:`${yyyy}-${mm}-15`};

  const[empData,setEmpData]   =useState(()=>lsGet(LS_EMP_DATA,defEmpData));
  const[empleados,setEmpleados]=useState(()=>lsGet(LS_EMP,[]));
  const[historial,setHistorial]=useState(()=>lsGet(LS_HIST,[]));
  const[papelera,setPapelera]=useState(()=>lsGet(LS_PAP,[]));
  const[tab,setTab]            =useState("nomina");
  const[toastList,setToastList]=useState("");

  useEffect(()=>lsSet(LS_EMP,empleados),[empleados]);
  useEffect(()=>lsSet(LS_EMP_DATA,empData),[empData]);
  useEffect(()=>lsSet(LS_HIST,historial),[historial]);
  useEffect(()=>lsSet(LS_PAP,papelera),[papelera]);

  const calcsTodos=empleados.map(calcularEmpleado);
  const agregar=()=>setEmpleados(p=>[...p,emptyEmp()]);
  const eliminar=id=>setEmpleados(p=>p.filter(e=>e.id!==id));
  const actualizar=useCallback((id,field,val)=>
    setEmpleados(p=>p.map(e=>e.id===id?{...e,[field]:val}:e)),[]);
  const setEF=(field,val)=>setEmpData(p=>({...p,[field]:val}));

  const guardarPago=useCallback((emp,calcs,periodo)=>{
    const r={
      id:Date.now(),nombre:emp.nombre,cc:emp.cc,arlClase:emp.arlClase||"I",
      periodo:`${periodo.inicio} → ${periodo.fin}`,
      periodoKey:`${periodo.inicio}_${periodo.fin}`,
      fechaGuardado:new Date().toLocaleDateString("es-CO"),
      salarioBase:emp.salarioBase,diasTrabajados:emp.diasTrabajados,
      basico:calcs.basico,auxTransporte:calcs.auxTransporte,
      totalExtras:calcs.totalExtras,totalDevengado:calcs.totalDevengado,
      dedSalud:calcs.dedSalud,dedPension:calcs.dedPension,
      vales:calcs.vales,prestamos:calcs.prestamos,
      totalDeducciones:calcs.totalDeducciones,netoPagado:calcs.netoPagado,
      saludEmpresa:calcs.saludEmpresa,pensionEmpresa:calcs.pensionEmpresa,
      senaValor:calcs.senaValor,icbfValor:calcs.icbfValor,
      cajaValor:calcs.cajaValor,arlValor:calcs.arlValor,
      cesantias:calcs.cesantias,intCesantias:calcs.intCesantias,
      prima:calcs.prima,vacaciones:calcs.vacaciones,
    };
    setHistorial(p=>[r,...p]);
  },[]);

  const guardarLista=()=>{
    lsSet(LS_EMP,empleados);
    setToastList("✓ Lista guardada");
    setTimeout(()=>setToastList(""),3000);
  };

  const limpiarHistorial=()=>{
    if(window.confirm("¿Eliminar todo el historial de pagos? No se puede deshacer."))
      setHistorial([]);
  };
  const borrarRegistro=useCallback((registroId)=>{
    if(window.confirm("¿Mover este registro a la papelera? Puedes recuperarlo después.")){
      const reg=historial.find(r=>r.id===registroId);
      if(reg){
        setPapelera(p=>[reg,...p]);
        setHistorial(p=>p.filter(r=>r.id!==registroId));
      }
    }
  },[historial]);
  const recuperarRegistro=useCallback((registroId)=>{
    const reg=papelera.find(r=>r.id===registroId);
    if(reg){
      setHistorial(p=>[reg,...p]);
      setPapelera(p=>p.filter(r=>r.id!==registroId));
    }
  },[papelera]);
  const limpiarPapelera=()=>{
    if(window.confirm("¿Eliminar definitivamente todos los registros de la papelera?"))
      setPapelera([]);
  };

  const periodo={inicio:empData.inicio,fin:empData.fin};

  return(
    <div className="app">
      <header className="app-header">
        <div className="header-top">
          <div className="header-brand">
            <span className="header-icon">🏭</span>
            <div>
              <div className="header-title">NÓMINA QUINCENAL</div>
              <div className="header-sub">Sistema de Liquidación Laboral · Colombia</div>
            </div>
          </div>
          <div className="header-meta">
            <label className="meta-label">Empresa
              <input className="meta-input" value={empData.nombre} onChange={e=>setEF("nombre",e.target.value)} placeholder="Nombre empresa"/>
            </label>
            <label className="meta-label">NIT
              <input className="meta-input" value={empData.nit} onChange={e=>setEF("nit",e.target.value)} placeholder="NIT empresa"/>
            </label>
          </div>
        </div>
        <div className="header-periodo">
          <span className="periodo-label">Período de pago</span>
          <input type="date" className="date-input" value={empData.inicio} onChange={e=>setEF("inicio",e.target.value)}/>
          <span className="periodo-sep">→</span>
          <input type="date" className="date-input" value={empData.fin} onChange={e=>setEF("fin",e.target.value)}/>
          <span className="smmlv-badge">SMMLV 2026: {fmt(SMMLV)} · Aux.T: {fmt(AUX_TRANSPORTE)}</span>
        </div>
      </header>

      <div className="tabs">
        <button className={"tab"+(tab==="nomina"?" tab--active":"")} onClick={()=>setTab("nomina")}>👥 Empleados ({empleados.length})</button>
        <button className={"tab"+(tab==="resumen"?" tab--active":"")} onClick={()=>setTab("resumen")}>📊 Resumen Empresa</button>
        <button className={"tab"+(tab==="historial"?" tab--active":"")} onClick={()=>setTab("historial")}>📋 Historial ({historial.length})</button>
      </div>

      <main className="app-main">
        {tab==="nomina"&&(
          <div>
            {empleados.map((emp,idx)=>(
              <EmpleadoCard key={emp.id} emp={emp} idx={idx}
                onChange={actualizar} onRemove={eliminar}
                onGuardar={guardarPago} calcs={calcsTodos[idx]} periodo={periodo} historial={historial}/>
            ))}
            <button className="btn-add" onClick={agregar}>+ Agregar empleado</button>
            <div className="save-bar" style={{marginTop:16}}>
              <button className="btn-save" onClick={guardarLista}>💾 Guardar lista de empleados</button>
              {toastList&&<span className="save-toast">{toastList}</span>}
            </div>
          </div>
        )}
        {tab==="resumen"&&
          <ResumenEmpresa empleados={empleados} calcsTodos={calcsTodos} periodo={periodo} onChangePeriodo={(field,val)=>setEF(field,val)} historial={historial}/>}
        {tab==="historial"&&
          <Historial historial={historial} papelera={papelera} onLimpiar={limpiarHistorial} onBorrarRegistro={borrarRegistro} onRecuperar={recuperarRegistro} onLimpiarPapelera={limpiarPapelera}/>}
      </main>

      <footer className="app-footer">
        <span>ColNómina · {empData.nombre||"Empresa"} · {empData.inicio} / {empData.fin}</span>
        <span className="footer-note">Tasas 2026 (Decretos 1469 &amp; 1470 · Ley 2466) · Solo referencia · Verifique con su contador</span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
